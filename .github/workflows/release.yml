name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: crabster-linux
            asset_name: crabster-linux-amd64
          - os: windows-latest
            artifact_name: crabster-windows
            asset_name: crabster-windows-amd64.exe

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: web
      run: npm install

    - name: Build Frontend
      working-directory: web
      run: npm run build

    - name: Compress Frontend
      shell: bash
      run: gzip -9 -c static/index.html > static/index.html.gz

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release Binary
      run: cargo build --release

    - name: Prepare Assets
      shell: bash
      run: |
        mkdir -p assets
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp target/release/crabster.exe assets/${{ matrix.asset_name }}
          # Build Inno Setup Installer
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          cp target/installer/crabster-windows-installer.exe assets/
        else
          cp target/release/crabster assets/${{ matrix.asset_name }}
          ./target/release/crabster --completions bash > assets/crabster.bash
          ./target/release/crabster --completions zsh > assets/_crabster
          ./target/release/crabster --completions fish > assets/crabster.fish
          cargo install cargo-deb || true
          cargo deb
          cp target/debian/*.deb assets/
        fi

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: assets/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
