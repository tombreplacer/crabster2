name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: web
      run: npm install

    - name: Build Frontend
      working-directory: web
      run: npm run build

    - name: Compress Frontend
      shell: bash
      run: gzip -9 -c static/index.html > static/index.html.gz

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run Tests
      run: cargo test --verbose

    - name: Build Release
      run: cargo build --release

    - name: Upload Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: crabster-linux
        path: target/release/crabster

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: crabster-windows
        path: target/release/crabster.exe

    - name: Build Debian Package
      if: matrix.os == 'ubuntu-latest'
      run: |
        ./target/release/crabster --completions bash > crabster.bash
        ./target/release/crabster --completions zsh > _crabster
        ./target/release/crabster --completions fish > crabster.fish
        cargo install cargo-deb || true
        cargo deb
        
    - name: Upload Debian Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: crabster-deb
        path: target/debian/*.deb
