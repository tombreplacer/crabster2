name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: web
      run: npm install

    - name: Build Frontend
      working-directory: web
      run: npm run build

    - name: Compress Frontend
      run: gzip -9 -c static/index.html > static/index.html.gz

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run Tests
      run: cargo test --verbose

    - name: Build Release
      run: cargo build --release

    - name: Install cargo-deb
      run: cargo install cargo-deb || true

    - name: Build Debian Package
      run: |
        ./target/release/crabster --completions bash > crabster.bash
        ./target/release/crabster --completions zsh > _crabster
        ./target/release/crabster --completions fish > crabster.fish
        cargo deb

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crabster-deb
        path: target/debian/*.deb
