[package]
name = "crabster"
version = "0.1.2"
edition = "2021"
description = "A beautiful cross-platform CLI file server with web UI"
license = "MIT"

[[bin]]
name = "crabster"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
percent-encoding = "2"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Developer <dev@example.com>"
copyright = "2026"
extended-description = "A beautiful cross-platform CLI file server with web UI"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/crabster", "usr/bin/", "755"],
    ["crabster.bash", "usr/share/bash-completion/completions/crabster", "644"],
    ["_crabster", "usr/share/zsh/vendor-completions/", "644"],
    ["crabster.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
