[package]
name = "crabster"
version = "0.1.0"
edition = "2021"
description = "A beautiful cross-platform CLI file server with web UI"
license = "MIT"

[[bin]]
name = "crabster"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
percent-encoding = "2"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
